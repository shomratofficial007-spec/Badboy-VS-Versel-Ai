name: Detekt Kotlin Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: detekt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned Detekt CLI
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            --proto '=https' --proto-redir '=https' --silent --show-error \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar \
            --output detekt-cli.jar
          test -s detekt-cli.jar

      - name: Analyze Kotlin sources
        run: |
          mkdir -p build/reports
          java -jar detekt-cli.jar \
            --input artifacts/mobile/modules/badboy-wakeword/android/src/main/java \
            --config config/detekt/detekt.yml \
            --report sarif:build/reports/detekt.sarif \
            --max-issues 1000

      - name: Upload Detekt findings to code scanning
        if: always() && hashFiles('build/reports/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt.sarif
          category: detekt
