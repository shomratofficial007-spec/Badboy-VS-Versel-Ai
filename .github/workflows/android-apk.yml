name: Android APK (automatic + manual)

# Automatically validate and build on app changes and pull requests.
# Manual workflow_dispatch remains available for on-demand builds.
on:
  push:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug-apk:
    name: Validate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and mobile tests
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/mobile run test

      - name: Generate native Android project with Expo Prebuild
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --no-install

      - name: Build installable debug APK with embedded JavaScript
        working-directory: artifacts/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains the JavaScript bundle
        working-directory: artifacts/mobile/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.android.bundle > /tmp/badboy-index.android.bundle
          test -s /tmp/badboy-index.android.bundle
          echo "Verified embedded JavaScript bundle ($(wc -c < /tmp/badboy-index.android.bundle) bytes)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badboy-android-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
