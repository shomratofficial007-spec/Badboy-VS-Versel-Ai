name: Android APK (manual)

# This workflow is intentionally manual. It does not run on pushes or PRs.
# It creates the Android native project in the ephemeral GitHub runner,
# validates the app, builds an installable debug APK, and uploads it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug-apk:
    name: Validate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and mobile tests
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/mobile run test

      - name: Generate native Android project with Expo Prebuild
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        working-directory: artifacts/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: badboy-android-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
