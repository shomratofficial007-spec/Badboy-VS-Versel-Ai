name: Android APK (automatic + manual)

# Automatically validate and build on app changes and pull requests.
# Manual workflow_dispatch remains available for on-demand builds.
on:
  push:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: Validate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and mobile tests
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/mobile run test

      - name: Generate native Android project with Expo Prebuild
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --no-install

      - name: Verify React Native debug bundle configuration
        working-directory: artifacts/mobile/android
        run: |
          sed -n '/react[[:space:]]*{/,/^[[:space:]]*}/p' app/build.gradle
          grep -Fq 'debuggableVariants = []' app/build.gradle

      - name: Build installable debug APK with embedded JavaScript
        working-directory: artifacts/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug

      - name: Verify TFLite model is packaged uncompressed
        working-directory: artifacts/mobile/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          python3 - <<'PY'
          import zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              name = "assets/wake.tflite"
              try:
                  model = archive.getinfo(name)
              except KeyError as exc:
                  raise SystemExit(f"Missing required wake-word model asset: {name}") from exc
              if model.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit("wake.tflite must be uncompressed for AssetManager.openFd()")
              print(f"Verified {name}: {model.file_size} bytes, stored without compression.")
          PY

      - name: Verify APK contains the JavaScript bundle
        working-directory: artifacts/mobile/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -p "$APK" assets/index.android.bundle > /tmp/badboy-index.android.bundle
          test -s /tmp/badboy-index.android.bundle
          echo "Verified embedded JavaScript bundle ($(wc -c < /tmp/badboy-index.android.bundle) bytes)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: badboy-android-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
