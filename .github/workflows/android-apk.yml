name: Build Android APK

# EAS Android builds have a monthly free-plan quota. Keep this workflow
# manually triggerable so exhausted EAS quota does not fail every push/PR.
# The free GitHub-hosted runner workflow builds the APK automatically instead.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN. Add an Expo access token in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Link existing Expo project
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --id 7e81e952-0453-43f1-94b2-e2ce873a6382 --non-interactive

      - name: Build Android APK
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
