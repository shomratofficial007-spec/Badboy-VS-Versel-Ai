name: Apply Production D1 Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this will apply pending migrations to the production D1 database."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations to production D1
    if: ${{ inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Show production migration status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if output=$(pnpm exec wrangler d1 migrations list badboy-agent-db --remote --config wrangler.json 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if ! grep -q '\[code: 7500\]' <<<"$output"; then
              echo "::error::D1 migration status failed with a non-retryable error."
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::D1 returned transient internal error 7500 after 5 attempts."
              exit 1
            fi
            delay=$((5 * (2 ** (attempt - 1))))
            echo "D1 internal error 7500; retrying in ${delay}s (attempt $((attempt + 1))/5)."
            sleep "$delay"
          done

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if output=$(pnpm exec wrangler d1 migrations apply badboy-agent-db --remote --config wrangler.json 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            printf '%s\n' "$output"
            if ! grep -q '\[code: 7500\]' <<<"$output"; then
              echo "::error::D1 migration apply failed with a non-retryable error."
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::D1 returned transient internal error 7500 after 5 apply attempts."
              exit 1
            fi
            delay=$((5 * (2 ** (attempt - 1))))
            echo "D1 internal error 7500; retrying in ${delay}s (attempt $((attempt + 1))/5)."
            sleep "$delay"
          done
