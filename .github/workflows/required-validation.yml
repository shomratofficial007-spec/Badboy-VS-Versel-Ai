name: Required Validation

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: required-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lockfile-refresh:
    name: Refresh security-patched dependency lockfile
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate the lockfile from the patched manifests without running package scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit the lockfile only when dependency resolutions changed
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches the patched dependency manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh security-patched lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real Build and Test workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Build and Test
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real Mobile checks workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Mobile checks
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real SonarCloud workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: SonarCloud Analysis
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  semgrep-security-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real Semgrep workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Semgrep Security Scan
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  detekt-kotlin-analysis:
    name: Detekt Kotlin Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real Detekt workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Detekt Kotlin Analysis
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  owasp-zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real OWASP ZAP workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: OWASP ZAP Baseline
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real Mobile SBOM workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Mobile SBOM
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ai-sdk-validation:
    name: AI SDK Validation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - name: Verify the real AI SDK workflow
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: AI SDK validation
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all direct and transitive dependencies for known high-severity advisories
        run: pnpm audit --audit-level high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree for exposed secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce approved production dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          pnpm licenses list --recursive --json --prod > licenses.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync('licenses.json', 'utf8'));
          const allowed = new Set([
            'MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC',
            '0BSD', 'CC0-1.0', 'Unlicense', 'MPL-2.0', 'Zlib',
            'OFL-1.1', 'Python-2.0', 'BlueOak-1.0.0',
            'Unicode-DFS-2016', 'CC-BY-4.0', 'PostgreSQL',
          ]);
          const licenses = Object.keys(report);
          if (!licenses.length) throw new Error('Production license inventory is empty.');

          function isAllowed(expression) {
            const alternatives = expression
              .replace(/[()]/g, '')
              .split(/\s+OR\s+/i);
            return alternatives.some((alternative) =>
              alternative.split(/\s+AND\s+/i)
                .map((id) => id.trim())
                .filter(Boolean)
                .every((id) => allowed.has(id))
            );
          }

          const rejected = licenses.filter((license) => !isAllowed(license));
          console.log(`Inspected ${licenses.length} production license expression(s).`);
          for (const license of rejected) {
            console.error(`REVIEW REQUIRED: ${license}`);
            for (const pkg of report[license] ?? []) {
              console.error(`  - ${pkg.name ?? 'unknown package'} ${(pkg.versions ?? []).join(', ')}`);
            }
          }
          if (rejected.length) {
            throw new Error(`Unapproved or unknown production license(s): ${rejected.join(', ')}`);
          }
          console.log('All production dependency licenses satisfy the approved policy.');
          NODE

  api-security-tests:
    name: API Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Worker API route, authorization, owner isolation, and request validation tests
        run: pnpm --filter @workspace/functions test

  d1-migration-validation:
    name: D1 Migration Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply all D1 migrations to an isolated local database
        run: pnpm exec wrangler d1 migrations apply badboy-agent-db --local --config wrangler.json

  authentication-tests:
    name: Authentication Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Worker bearer-token and Access JWT authentication
        run: pnpm --filter @workspace/functions exec node --experimental-strip-types --test accessAuth.test.ts personalAuth.test.ts
      - name: Test mobile owner login, secure token storage, and session handling
        run: pnpm --filter @workspace/mobile test

  coverage-validation:
    name: Coverage Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the real SonarCloud analysis
        run: bash .github/scripts/wait-for-workflow-run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: SonarCloud Analysis
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Verify SonarCloud New Code coverage and Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: shomratofficial007-spec_Badboy-VS-Versel-Ai
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_HOST_URL: https://sonarcloud.io
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is missing; cannot verify remote coverage."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            measures="$(curl --silent --show-error --fail --user "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=new_coverage&pullRequest=$PR_NUMBER" || true)"
            gate_response="$(curl --silent --show-error --fail --user "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&pullRequest=$PR_NUMBER" || true)"
            coverage="$(printf '%s' "$measures" | jq -r '.component.measures[]? | select(.metric == "new_coverage") | .value' | head -n 1)"
            gate="$(printf '%s' "$gate_response" | jq -r '.projectStatus.status // empty')"

            if [[ "$coverage" =~ ^[0-9]+([.][0-9]+)?$ && -n "$gate" ]]; then
              echo "SonarCloud New Code coverage: $coverage%; Quality Gate: $gate"
              if [[ "$gate" != "OK" ]]; then
                echo "::error::SonarCloud Quality Gate is $gate."
                exit 1
              fi
              if ! awk "BEGIN { exit !($coverage >= 80) }"; then
                echo "::error::New Code coverage $coverage% is below the required 80%."
                exit 1
              fi
              echo "Coverage Validation passed with the remote SonarCloud result."
              exit 0
            fi

            echo "SonarCloud analysis is still processing (attempt $attempt/30)."
            sleep 10
          done

          echo "::error::Could not retrieve the completed SonarCloud PR coverage and Quality Gate."
          exit 1
