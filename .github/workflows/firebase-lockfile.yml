name: Refresh Firebase dependency lockfile

on:
  push:
    branches: [feat/firebase-auth-firestore]
    paths:
      - "artifacts/mobile/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --lockfile-only --frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches manifests."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile for Firebase"
            git push
          fi
