name: Build Android APK (Free GitHub Runner)

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk-free.yml"

jobs:
  build-apk:
    name: Prebuild Expo Android and assemble release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm
        shell: bash
        run: |
          npm install --global pnpm@10.8.1
          GLOBAL_NPM_PREFIX="$(npm prefix --global)"
          echo "$GLOBAL_NPM_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$GLOBAL_NPM_PREFIX/bin:$PATH"
          command -v pnpm
          pnpm --version

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          # Expo SDK 57 configures compileSdk 36 and NDK 27.1.12297006.
          # Install the exact native toolchain explicitly before Expo prebuild.
          rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          test -s "$ANDROID_HOME/ndk/27.1.12297006/source.properties"
          grep -F "Pkg.Revision = 27.1.12297006" "$ANDROID_HOME/ndk/27.1.12297006/source.properties"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Build installable release APK with embedded JavaScript bundle
        working-directory: artifacts/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          # Maven Central can intermittently time out while downloading large React Native AARs.
          # Increase HTTP timeouts and retry transient dependency-download failures.
          for attempt in 1 2 3; do
            echo "Gradle release build attempt $attempt of 3"
            if ./gradlew --no-daemon -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=1000 assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed; waiting 20 seconds before retrying (dependency downloads may be transient)."
              sleep 20
            fi
          done
          echo "Gradle release build failed after 3 attempts. See the first dependency-resolution error above."
          exit 1

      - name: Verify release APK exists
        run: test -s artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: badboy-ai-release-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
