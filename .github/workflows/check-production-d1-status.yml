name: Check Production D1 Migration Status

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-production-d1-status.yml"

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-status-check
  cancel-in-progress: false

jobs:
  status:
    name: Read production D1 migration status (read-only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read D1 migration table through Cloudflare API (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: be5648fd-cbb2-487c-8d99-6a0f8c72cf46
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"

          query_d1() {
            local sql="$1"
            local output="$2"
            local status
            status=$(curl -sS -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg sql "$sql" '{sql:$sql}')" \
              -o "$output" -w "%{http_code}")
            echo "Cloudflare D1 API HTTP status: $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ "$(jq -r '.success // false' "$output")" != "true" ]; then
              jq -c '{success, errors}' "$output" || true
              return 1
            fi
          }

          echo "Checking whether the D1 migration history table exists..."
          query_d1 "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations'" /tmp/d1-schema.json

          if [ "$(jq -r '[.result[]?.results[]? | select(.name == "d1_migrations")] | length' /tmp/d1-schema.json)" -eq 0 ]; then
            echo "::notice::The d1_migrations table does not exist in this database. No migration history has been recorded there."
            exit 0
          fi

          echo "Reading applied migration history..."
          query_d1 "SELECT * FROM d1_migrations ORDER BY id" /tmp/d1-migrations.json
          jq -r '.result[]?.results[]? | [.id, .name, (.applied_at // "timestamp unavailable")] | @tsv' /tmp/d1-migrations.json
          echo "Read-only migration history check completed."
