name: Check Production D1 Migration Status

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-production-d1-status.yml"

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-status-check
  cancel-in-progress: false

jobs:
  status:
    name: Verify production D1 migration objects (read-only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify production D1 schema and migration objects (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: be5648fd-cbb2-487c-8d99-6a0f8c72cf46
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query_d1() {
            local sql="$1" output="$2"
            local status
            status=$(curl -sS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$(jq -n --arg sql "$sql" '{sql:$sql}')" -o "$output" -w "%{http_code}")
            echo "Cloudflare D1 API HTTP status: $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ "$(jq -r '.success // false' "$output")" != "true" ]; then
              jq -c '{success, errors}' "$output" || true
              return 1
            fi
          }
          query_d1 "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" /tmp/tables.json
          query_d1 "SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name" /tmp/indexes.json
          echo "=== TABLES ==="
          jq -r '.result[]?.results[]?.name' /tmp/tables.json
          echo "=== INDEXES ==="
          jq -r '.result[]?.results[]?.name' /tmp/indexes.json
          echo "=== MIGRATION HISTORY ==="
          if [ "$(jq -r '[.result[]?.results[]? | select(.name == "d1_migrations")] | length' /tmp/tables.json)" -eq 0 ]; then
            echo "d1_migrations: MISSING"
          else
            query_d1 "SELECT * FROM d1_migrations ORDER BY id" /tmp/history.json
            jq -r '.result[]?.results[]? | [.id, .name] | @tsv' /tmp/history.json
          fi
