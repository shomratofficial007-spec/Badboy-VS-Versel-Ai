name: Reconcile Production D1 Migration History

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-production-d1-status.yml"

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-status-check
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile D1 migration ledger after schema verification
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify existing schema and reconcile migration ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: be5648fd-cbb2-487c-8d99-6a0f8c72cf46
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"
          query_d1() {
            local sql="$1" output="$2"
            local status
            status=$(curl -sS -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$(jq -n --arg sql "$sql" '{sql:$sql}')" -o "$output" -w "%{http_code}")
            echo "Cloudflare D1 API HTTP status: $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ "$(jq -r '.success // false' "$output")" != "true" ]; then
              jq -c '{success, errors}' "$output" || true
              return 1
            fi
          }

          query_d1 "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" /tmp/tables.json
          query_d1 "SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name" /tmp/indexes.json

          expected_tables='["agent_tasks","agent_task_events","agent_projects","agent_project_memory","agent_audit_logs"]'
          expected_indexes='["idx_agent_tasks_owner_updated","idx_agent_tasks_owner_status_created","idx_agent_task_events_owner_task_created","idx_agent_projects_owner_updated","idx_agent_memory_owner_project_updated","idx_agent_audit_owner_created"]'

          for name in $(echo "$expected_tables" | jq -r '.[]'); do
            if [ "$(jq --arg n "$name" '[.result[]?.results[]? | select(.name == $n)] | length' /tmp/tables.json)" -eq 0 ]; then
              echo "::error::Required table $name is missing; refusing to alter migration history."
              exit 1
            fi
          done
          for name in $(echo "$expected_indexes" | jq -r '.[]'); do
            if [ "$(jq --arg n "$name" '[.result[]?.results[]? | select(.name == $n)] | length' /tmp/indexes.json)" -eq 0 ]; then
              echo "::error::Required index $name is missing; refusing to alter migration history."
              exit 1
            fi
          done

          echo "All tables and indexes from 0001_agent_persistence.sql already exist."
          query_d1 "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)" /tmp/create-ledger.json
          query_d1 "INSERT INTO d1_migrations (name) SELECT '0001_agent_persistence.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0001_agent_persistence.sql')" /tmp/record-migration.json

          echo "Migration ledger reconciliation complete. No application tables or records were changed."
