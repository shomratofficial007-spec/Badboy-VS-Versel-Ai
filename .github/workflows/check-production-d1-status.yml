name: Inspect Production D1 Schema (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only production D1 inspection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare token and required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }

          response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          status="$(printf '%s' "$response" | jq -r '.result.status // empty')"
          if [[ "$status" != "active" ]]; then
            echo "::error::Cloudflare API token is not active. Check the GitHub CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          echo "Cloudflare API token is active. D1 account/database access will be checked separately."

      - name: Inspect production D1 schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: be5648fd-cbb2-487c-8d99-6a0f8c72cf46
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"

          query_d1() {
            local sql="$1" output="$2"
            local status
            status="$(curl --silent --show-error -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg sql "$sql" '{sql:$sql}')" \
              -o "$output" -w "%{http_code}")"

            if [[ "$status" -lt 200 || "$status" -ge 300 ]] || [[ "$(jq -r '.success // false' "$output")" != "true" ]]; then
              echo "::error::Cloudflare D1 API request failed (HTTP $status)."
              jq -c '{success, errors}' "$output" || true
              if [[ "$status" == "401" || "$status" == "403" ]]; then
                echo "::error::The token must belong to the configured Cloudflare account and include D1 Read permission for this account."
              fi
              return 1
            fi
          }

          query_d1 "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" /tmp/d1-tables.json
          query_d1 "SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name" /tmp/d1-indexes.json

          echo "=== TABLES ==="
          jq -r '.result[]?.results[]?.name' /tmp/d1-tables.json
          echo "=== INDEXES ==="
          jq -r '.result[]?.results[]?.name' /tmp/d1-indexes.json

          if [[ "$(jq '[.result[]?.results[]? | select(.name == "d1_migrations")] | length' /tmp/d1-tables.json)" -gt 0 ]]; then
            query_d1 "SELECT id, name, applied_at FROM d1_migrations ORDER BY id" /tmp/d1-history.json
            echo "=== RECORDED MIGRATIONS ==="
            jq -r '.result[]?.results[]? | [.id, .name, .applied_at] | @tsv' /tmp/d1-history.json
          else
            echo "No d1_migrations ledger table is present."
          fi

          echo "Read-only inspection complete. No production tables, records, or migration history were changed."
