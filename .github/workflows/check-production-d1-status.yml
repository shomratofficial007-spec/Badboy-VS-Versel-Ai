name: Verify Production D1 Schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badboy-production-d1-status-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production D1 schema (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify existing schema without modifying production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: be5648fd-cbb2-487c-8d99-6a0f8c72cf46
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query"

          query_d1() {
            local sql="$1" output="$2" status attempt delay
            for attempt in 1 2 3 4 5; do
              status=$(curl -sS -X POST "$API" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$(jq -n --arg sql "$sql" '{sql:$sql}')" \
                -o "$output" -w "%{http_code}")
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] && [ "$(jq -r '.success // false' "$output")" = "true" ]; then
                return 0
              fi

              jq -c '{success, errors}' "$output" || true
              if ! jq -e 'any(.errors[]?; .code == 7500)' "$output" >/dev/null; then
                echo "::error::D1 schema verification failed with a non-retryable API error (HTTP $status)."
                return 1
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::D1 returned transient internal error 7500 after 5 attempts."
                return 1
              fi
              delay=$((5 * (2 ** (attempt - 1))))
              echo "D1 internal error 7500; retrying in ${delay}s (attempt $((attempt + 1))/5)."
              sleep "$delay"
            done
          }

          query_d1 "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" /tmp/tables.json
          query_d1 "SELECT name FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name" /tmp/indexes.json

          expected_tables='["agent_tasks","agent_task_events","agent_projects","agent_project_memory","agent_audit_logs"]'
          expected_indexes='["idx_agent_tasks_owner_updated","idx_agent_tasks_owner_status_created","idx_agent_task_events_owner_task_created","idx_agent_projects_owner_updated","idx_agent_memory_owner_project_updated","idx_agent_audit_owner_created"]'

          for name in $(echo "$expected_tables" | jq -r '.[]'); do
            if [ "$(jq --arg n "$name" '[.result[]?.results[]? | select(.name == $n)] | length' /tmp/tables.json)" -eq 0 ]; then
              echo "::error::Required table $name is missing."
              exit 1
            fi
          done
          for name in $(echo "$expected_indexes" | jq -r '.[]'); do
            if [ "$(jq --arg n "$name" '[.result[]?.results[]? | select(.name == $n)] | length' /tmp/indexes.json)" -eq 0 ]; then
              echo "::error::Required index $name is missing."
              exit 1
            fi
          done

          echo "Production D1 schema verification passed. This workflow performed SELECT queries only."
