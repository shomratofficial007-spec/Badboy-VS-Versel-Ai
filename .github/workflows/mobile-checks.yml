name: Mobile checks

on:
  pull_request:
    paths:
      - "artifacts/mobile/**"
      - ".github/workflows/android-apk.yml"
      - "artifacts/mobile/eas.json"
      - "artifacts/mobile/app.json"
      - "functions/**"
      - "wrangler.json"
      - "artifacts/mobile/wrangler.json"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-checks.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/mobile/**"
      - "functions/**"
      - "wrangler.json"
      - "artifacts/mobile/wrangler.json"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-checks.yml"

jobs:
  mobile-tests-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mobile unit tests
        run: pnpm --filter @workspace/mobile run test
      - name: Build workspace libraries
        run: pnpm run typecheck:libs
      - name: TypeScript check
        run: pnpm --filter @workspace/mobile run typecheck
      - name: Production web build
        run: pnpm --filter @workspace/mobile run build
