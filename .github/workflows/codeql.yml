# CodeQL advanced setup for Java/Kotlin (Expo prebuild + Gradle), JavaScript/TypeScript, and Actions.
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "43 13 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Kotlin wake-word module is an Expo Android library, not a root Gradle
      # project. Generate the Android host project before CodeQL initialization.
      - name: Set up Java for Android
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        if: matrix.language == 'java-kotlin'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up pnpm and Node for Expo prebuild
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable pnpm
        if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Install workspace dependencies
        if: matrix.language == 'java-kotlin'
        run: pnpm install --frozen-lockfile

      - name: Generate Android Gradle project
        if: matrix.language == 'java-kotlin'
        run: pnpm --dir artifacts/mobile exec expo prebuild --platform android --no-install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Android Kotlin sources for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: artifacts/mobile/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
