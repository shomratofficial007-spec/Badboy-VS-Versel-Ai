# CodeQL advanced setup for Java/Kotlin (Expo prebuild + Gradle), JavaScript/TypeScript, and Actions.
name: "CodeQL Advanced"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "43 13 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # CodeQL must observe the actual Gradle compilation of the Expo-generated
      # Android host project; this repository has no Gradle project at its root.
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        if: matrix.language == 'java-kotlin'
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project with Expo Prebuild
        if: matrix.language == 'java-kotlin'
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --no-install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # This is deliberately a real Gradle build, not a synthetic root wrapper.
      # It compiles the app and included Kotlin Expo modules while CodeQL traces
      # Java/Kotlin compiler activity.
      - name: Increase Gradle distribution download timeout for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: artifacts/mobile/android
        run: |
          PROPERTIES="gradle/wrapper/gradle-wrapper.properties"
          if grep -q '^networkTimeout=' "$PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$PROPERTIES"
          else
            printf '\nnetworkTimeout=120000\n' >> "$PROPERTIES"
          fi

      - name: Build Android project for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: artifacts/mobile/android
        env:
          NODE_ENV: production
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::CodeQL Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle download/build attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
