# CodeQL advanced setup for Java/Kotlin (Expo prebuild + Gradle), JavaScript/TypeScript, and Actions.
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "43 13 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Kotlin wake-word module is an Expo Android library, not a root Gradle
      # project. Generate the Android host project before CodeQL initialization.
      - name: Set up Java for Android
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDKMANAGER_STATUS" -eq 0
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Enable pnpm
        if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node for Expo prebuild
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        if: matrix.language == 'java-kotlin'
        run: pnpm install --frozen-lockfile

      - name: Generate Android Gradle project
        if: matrix.language == 'java-kotlin'
        run: pnpm --dir artifacts/mobile exec expo prebuild --platform android --no-install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
