name: PR Agent with Gemini

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - id: pr-agent
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the Google AI Studio LiteLLM provider explicitly. A bare
          # Gemini model name can route to Vertex AI and require ADC.
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '[]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.git_provider: "github"
          config.allow_bugs: "true"
