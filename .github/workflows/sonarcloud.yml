name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Test, coverage, and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Secrets are unavailable to fork PRs. Repository PRs and main-branch pushes can use SONAR_TOKEN.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Run Worker tests as a direct Node child of c8 so the coverage collector
      # measures the exact TypeScript test process. Run mobile tests separately.
      - name: Run Worker tests and generate LCOV coverage
        run: >-
          pnpm dlx c8@10.1.3
          --reporter=lcov
          --reporter=text
          --all
          --extension=.ts
          --extension=.tsx
          --include='functions/**/*.ts'
          --include='lib/**/*.ts'
          --include='artifacts/mobile/**/*.ts'
          --include='artifacts/mobile/**/*.tsx'
          --exclude='**/*.test.ts'
          --exclude='**/*.d.ts'
          --exclude='**/*.spec.ts'
          --
          node --experimental-strip-types --test
          functions/functions.test.ts
          functions/developerAgent.test.ts
          functions/agentStorage.test.ts
          functions/accessAuth.test.ts
          functions/personalAuth.test.ts

      - name: Run mobile tests
        run: pnpm --filter @workspace/mobile test

      - name: Verify LCOV report exists
        run: test -s coverage/lcov.info

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
