name: SonarCloud Analysis

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Test, coverage, and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Secrets are unavailable to fork PRs. Repository PRs and main-branch pushes can use SONAR_TOKEN.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests and generate LCOV coverage
        run: >-
          pnpm dlx c8@10.1.3
          --reporter=lcov
          --reporter=text
          --all
          --extension=.ts
          --extension=.tsx
          --include='functions/**/*.ts'
          --include='lib/**/*.ts'
          --include='artifacts/mobile/**/*.ts'
          --include='artifacts/mobile/**/*.tsx'
          --exclude='**/*.test.ts'
          --exclude='**/*.spec.ts'
          -- pnpm -r --if-present run test

      - name: Verify LCOV report exists
        run: test -s coverage/lcov.info

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
