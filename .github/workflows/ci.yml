name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (errors and warnings)
        run: pnpm run lint

      - name: Vitest API and logic tests
        run: pnpm run test:vitest

      - name: Typecheck and build
        run: pnpm run build

      - name: Run existing workspace tests
        run: pnpm -r --if-present run test

      - name: Apply D1 migrations to an isolated local database
        run: pnpm exec wrangler d1 migrations apply badboy-agent-db --local --config wrangler.json
