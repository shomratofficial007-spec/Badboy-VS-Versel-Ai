name: Mobile SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 13 * * 3"

permissions:
  contents: read

jobs:
  mobile-sbom:
    name: Generate mobile dependency SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SPDX JSON SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: badboy-mobile-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: badboy-mobile-sbom
          path: badboy-mobile-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
