# Replaces the retired/unresolvable EthicalCheck action with an OWASP ZAP
# passive baseline scan against this PR's Cloudflare Preview Worker.
name: OWASP ZAP Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 22 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan Badboy Cloudflare Preview
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ github.event_name == 'pull_request' && 'https://fix-pr-67-list-footer-null-type-badboy-vs-versel-ai.shomratofficial007.workers.dev' || 'https://badboy-vs-versel-ai.shomratofficial007.workers.dev' }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: badboy-zap-baseline-report
