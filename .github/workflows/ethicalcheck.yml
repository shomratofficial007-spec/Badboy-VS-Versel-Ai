# OWASP ZAP baseline scan against the exact PR Worker code in a local, isolated Wrangler runtime.
name: OWASP ZAP Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 22 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the mobile web assets
        run: pnpm --filter @workspace/mobile run build

      - name: Apply D1 migrations to an isolated local database
        run: pnpm exec wrangler d1 migrations apply badboy-agent-db --local

      - name: Start the PR Worker locally
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --ip 0.0.0.0 --port 8787 --persist-to "$RUNNER_TEMP/wrangler-zap" > "$RUNNER_TEMP/wrangler-zap.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/wrangler-zap.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ -o /dev/null; then
              echo "Local Wrangler Worker is responding."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/wrangler-zap.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/wrangler-zap.log"
              echo "::error::Local Wrangler Worker exited before becoming ready."
              exit 1
            fi
            echo "Waiting for local Wrangler Worker (attempt $attempt/30)."
            sleep 2
          done

          cat "$RUNNER_TEMP/wrangler-zap.log"
          echo "::error::Local Wrangler Worker did not become ready."
          exit 1

      - name: Verify security headers on the local Worker
        if: steps.worker.outcome == 'success'
        shell: bash
        run: |
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8787/)"
          csp="$(printf '%s\n' "$headers" | grep -i '^content-security-policy:' | head -n 1 || true)"
          if [[ -z "$csp" ]] \
            || printf '%s' "$csp" | grep -qi 'unsafe-eval' \
            || ! printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: credentialless' \
            || ! printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' \
            || ! printf '%s\n' "$headers" | grep -qi '^cross-origin-resource-policy: same-origin' \
            || ! printf '%s\n' "$headers" | grep -qi '^permissions-policy:' \
            || ! printf '%s\n' "$headers" | grep -qi '^x-frame-options:' \
            || ! printf '%s\n' "$headers" | grep -qi '^strict-transport-security:' \
            || ! printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'; then
            echo "::error::Local Worker does not expose the expected secure CSP/headers."
            printf '%s\n' "$headers"
            exit 1
          fi
          echo "Local Worker exposes the expected security headers and no unsafe-eval."
          echo "$csp"

      - name: Scan the local Worker with OWASP ZAP
        id: zap
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://172.17.0.1:8787
          allow_issue_writing: false
          fail_action: false
          artifact_name: badboy-zap-baseline-report

      - name: Enforce ZAP risk threshold (no Medium or High alerts)
        if: always() && steps.worker.outcome == 'success' && steps.zap.outcome != 'skipped'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const reportPath = 'report_json.json';
          if (!fs.existsSync(reportPath)) {
            throw new Error('ZAP JSON report is missing; scan did not produce auditable results.');
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const alerts = (report.site ?? []).flatMap((site) => site.alerts ?? []);
          const blocking = alerts.filter((alert) => /^(High|Medium)\\b/.test(alert.riskdesc ?? ''));

          for (const alert of alerts) {
            console.log(`${alert.riskdesc ?? 'Unknown risk'}: ${alert.name}`);
          }

          if (blocking.length) {
            for (const alert of blocking) {
              console.error(`::error::ZAP ${alert.riskdesc}: ${alert.name}`);
            }
            throw new Error(`ZAP found ${blocking.length} Medium/High alert(s). Review report_json.json.`);
          }

          console.log(`ZAP policy passed: no Medium/High alerts; ${alerts.length} Low/Informational finding(s) retained in the report.`);
          NODE

      - name: Stop the local Worker
        if: always() && steps.worker.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/wrangler-zap.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/wrangler-zap.pid")" 2>/dev/null || true
          fi
