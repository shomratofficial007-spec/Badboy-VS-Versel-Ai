# OWASP ZAP passive baseline scan against the exact Cloudflare deployment for this PR commit.
name: OWASP ZAP Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 22 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve the exact deployment URL for this PR commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "url=https://badboy-vs-versel-ai.shomratofficial007.workers.dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          short_sha="${PR_HEAD_SHA:0:7}"
          comments_url="https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"

          for attempt in $(seq 1 30); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$comments_url" -o "$RUNNER_TEMP/pr-comments.json"

            target_url="$(PR_HEAD_SHA="$PR_HEAD_SHA" COMMENTS_FILE="$RUNNER_TEMP/pr-comments.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sha = process.env.PR_HEAD_SHA ?? '';
          const comments = JSON.parse(fs.readFileSync(process.env.COMMENTS_FILE, 'utf8'));
          const botComment = [...comments].reverse().find((comment) =>
            comment.user?.login === 'cloudflare-workers-and-pages[bot]'
          );
          const body = botComment?.body ?? '';
          const rows = [...body.matchAll(/<tr>([\s\S]*?)<\/tr>/g)].map((match) => match[1]);
          const row = rows.find((value) => value.includes(sha.slice(0, 7)));
          const url = row?.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/i)?.[0] ?? '';
          process.stdout.write(url);
          NODE
          )"

            if [[ -n "$target_url" ]]; then
              echo "url=$target_url" >> "$GITHUB_OUTPUT"
              echo "Resolved exact Cloudflare preview deployment for commit $short_sha."
              exit 0
            fi

            echo "Waiting for Cloudflare to publish the preview URL for $short_sha (attempt $attempt/30)."
            sleep 10
          done

          echo "::error::No Cloudflare preview deployment was found for PR commit $short_sha."
          exit 1

      - name: Wait for the exact deployment security headers
        if: github.event_name == 'pull_request'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            headers="$(curl -fsS -D - -o /dev/null "$TARGET_URL/" || true)"
            csp="$(printf '%s\n' "$headers" | grep -i '^content-security-policy:' | head -n 1 || true)"
            if [[ -n "$csp" ]] \
              && ! printf '%s' "$csp" | grep -qi 'unsafe-eval' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: credentialless' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-resource-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^permissions-policy:' \
              && printf '%s\n' "$headers" | grep -qi '^x-frame-options:' \
              && printf '%s\n' "$headers" | grep -qi '^strict-transport-security:' \
              && printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'; then
              echo "Exact PR deployment has the expected security headers and no unsafe-eval."
              echo "$csp"
              exit 0
            fi
            echo "Exact PR deployment not ready or CSP still permits unsafe-eval (attempt $attempt/30)."
            sleep 10
          done
          echo "::error::Exact PR deployment does not expose the expected secure CSP/headers."
          exit 1

      - name: Scan the exact resolved Cloudflare deployment
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: badboy-zap-baseline-report

      - name: Enforce ZAP risk threshold (no Medium or High alerts)
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const reportPath = 'report_json.json';
          if (!fs.existsSync(reportPath)) {
            throw new Error('ZAP JSON report is missing; scan did not produce auditable results.');
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const alerts = (report.site ?? []).flatMap((site) => site.alerts ?? []);
          const blocking = alerts.filter((alert) => /^(High|Medium)\b/.test(alert.riskdesc ?? ''));

          for (const alert of alerts) {
            console.log(`${alert.riskdesc ?? 'Unknown risk'}: ${alert.name}`);
          }

          if (blocking.length) {
            for (const alert of blocking) {
              console.error(`::error::ZAP ${alert.riskdesc}: ${alert.name}`);
            }
            throw new Error(`ZAP found ${blocking.length} Medium/High alert(s). Review report_json.json.`);
          }

          console.log(`ZAP policy passed: no Medium/High alerts; ${alerts.length} Low/Informational finding(s) retained in the report.`);
          NODE
