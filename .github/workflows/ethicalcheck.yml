# OWASP ZAP passive baseline scan against the current PR's Cloudflare Preview Worker.
name: OWASP ZAP Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 22 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the correct scan target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            branch_slug="${HEAD_REF//\//-}"
            target_url="https://${branch_slug}-badboy-vs-versel-ai.shomratofficial007.workers.dev"
          else
            target_url="https://badboy-vs-versel-ai.shomratofficial007.workers.dev"
          fi
          echo "url=$target_url" >> "$GITHUB_OUTPUT"
          echo "ZAP target resolved for event: $EVENT_NAME"

      - name: Wait for the correct Cloudflare Preview security headers
        if: github.event_name == 'pull_request'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            headers="$(curl -fsS -D - -o /dev/null "$TARGET_URL/" || true)"
            if printf '%s\n' "$headers" | grep -qi '^content-security-policy:' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: credentialless' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-resource-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^permissions-policy:' \
              && printf '%s\n' "$headers" | grep -qi '^x-frame-options:' \
              && printf '%s\n' "$headers" | grep -qi '^strict-transport-security:' \
              && printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'; then
              echo "Current PR preview is serving the expected security headers."
              exit 0
            fi
            echo "Current PR preview not ready or headers incomplete (attempt $attempt/30); waiting 10 seconds."
            sleep 10
          done
          echo "::error::Current PR preview did not expose the expected security headers."
          exit 1

      - name: Scan the resolved Cloudflare target
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: badboy-zap-baseline-report
