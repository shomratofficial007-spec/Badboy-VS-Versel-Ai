# OWASP ZAP passive baseline scan against a verified Cloudflare preview for this PR.
name: OWASP ZAP Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 22 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve exact or verified-equivalent Cloudflare preview
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "url=https://badboy-vs-versel-ai.shomratofficial007.workers.dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comments_url="https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"

          for attempt in $(seq 1 30); do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$comments_url" -o "$RUNNER_TEMP/pr-comments.json"

            target_url="$(PR_HEAD_SHA="$PR_HEAD_SHA" PR_BASE_SHA="$PR_BASE_SHA" COMMENTS_FILE="$RUNNER_TEMP/pr-comments.json" GH_TOKEN="$GH_TOKEN" REPOSITORY="$REPOSITORY" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sha = process.env.PR_HEAD_SHA ?? '';
          const baseSha = process.env.PR_BASE_SHA ?? '';
          const token = process.env.GH_TOKEN ?? '';
          const repository = process.env.REPOSITORY ?? '';
          const comments = JSON.parse(fs.readFileSync(process.env.COMMENTS_FILE, 'utf8'));
          const botComment = [...comments].reverse().find((comment) =>
            comment.user?.login === 'cloudflare-workers-and-pages[bot]'
          );
          const body = botComment?.body ?? '';
          const rows = [...body.matchAll(/<tr>([\s\S]*?)<\/tr>/g)].map((match) => match[1]);

          function parseRow(row) {
            const cells = [...row.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)]
              .map((match) => match[1]);
            const commit = (cells[2] ?? '').replace(/<[^>]*>/g, '').trim();
            return {
              commit,
              url: row.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/i)?.[0] ?? '',
              success: /<b>Build:<\/b>\s*Success/i.test(row) &&
                /<b>Deployment:<\/b>\s*Success/i.test(row),
              failed: /<b>(?:Build|Deployment):<\/b>\s*Failed/i.test(row),
              inProgress: /<b>(?:Build|Deployment):<\/b>\s*In progress/i.test(row),
            };
          }

          const deployments = rows.map(parseRow);
          const exact = deployments.find((deployment) => deployment.commit.startsWith(sha.slice(0, 7)));

          if (exact?.failed) {
            throw new Error(`Cloudflare preview build failed for current PR commit ${sha.slice(0, 7)}.`);
          }

          if (exact?.success && exact.url) {
            process.stderr.write(`Using exact successful Cloudflare preview for ${exact.commit}.\n`);
            process.stdout.write(exact.url);
            process.exit(0);
          }

          if (!exact) {
            const latestSuccessful = deployments.find((deployment) =>
              deployment.success && deployment.url && deployment.commit
            );

            // CI/workflow-only changes cannot affect the Worker runtime.
            // If Cloudflare has not posted a preview comment, verify the full
            // PR diff against its base before selecting the production Worker.
            if (!latestSuccessful && baseSha) {
              const compareUrl = `https://api.github.com/repos/${repository}/compare/${baseSha}...${sha}`;
              const response = await fetch(compareUrl, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (!response.ok) {
                throw new Error(`GitHub PR diff verification returned ${response.status}; cannot select a ZAP target.`);
              }
              const comparison = await response.json();
              const files = comparison.files ?? [];
              const workerUnaffected = files.length > 0 && files.every((file) =>
                file.filename.startsWith('.github/')
              );
              if (workerUnaffected) {
                process.stderr.write(
                  `PR changes are limited to CI/workflow files; Worker runtime is unchanged. Scanning production Worker. Changed files: ${files.map((file) => file.filename).join(', ')}.\\n`
                );
                process.stdout.write('https://badboy-vs-versel-ai.shomratofficial007.workers.dev');
                process.exit(0);
              }
            }

            if (latestSuccessful) {
              const compareUrl = `https://api.github.com/repos/${repository}/compare/${latestSuccessful.commit}...${sha}`;
              const response = await fetch(compareUrl, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (!response.ok) {
                throw new Error(`GitHub compare API returned ${response.status}; cannot verify preview equivalence.`);
              }

              const comparison = await response.json();
              const files = comparison.files ?? [];
              const unsafe = [];

              for (const file of files) {
                if (
                  file.filename.startsWith('.github/') ||
                  file.filename === 'SECURITY-EXCEPTIONS.md' ||
                  file.filename === 'pnpm-lock.yaml' ||
                  file.filename === 'pnpm-workspace.yaml'
                ) {
                  continue;
                }

                if (file.filename === 'functions/api/[[path]].ts' && file.patch) {
                  const changedLines = file.patch.split('\n')
                    .filter((line) => /^[+-]/.test(line) && !/^(---|\+\+\+)/.test(line));
                  if (changedLines.length > 0 && changedLines.every((line) => /^[+-]\s*\/\//.test(line.trim()))) {
                    continue;
                  }
                }

                unsafe.push(file.filename);
              }

              if (files.length > 0 && unsafe.length === 0) {
                process.stderr.write(
                  `Current PR has no runtime-code changes since successful preview ${latestSuccessful.commit}; verified changed files: ${files.map((file) => file.filename).join(', ')}.\n`
                );
                process.stdout.write(latestSuccessful.url);
                process.exit(0);
              }

              process.stderr.write(
                `Latest successful preview ${latestSuccessful.commit} is stale for runtime files: ${unsafe.join(', ') || 'comparison did not contain a verifiable file list'}.\n`
              );
            }
          } else if (exact.inProgress || !exact.url) {
            process.stderr.write(`Cloudflare is still building current commit ${sha.slice(0, 7)}.\n`);
          }

          process.stdout.write('');
          NODE
          )"

            if [[ -n "$target_url" ]]; then
              echo "url=$target_url" >> "$GITHUB_OUTPUT"
              echo "Resolved a preview whose runtime code matches this PR."
              exit 0
            fi

            echo "Waiting for a current or verifiably equivalent Cloudflare preview (attempt $attempt/30)."
            sleep 10
          done

          echo "::error::No current or verifiably equivalent successful Cloudflare preview was available."
          exit 1

      - name: Verify security headers on the selected preview deployment
        if: github.event_name == 'pull_request'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            headers="$(curl -fsS -D - -o /dev/null "$TARGET_URL/" || true)"
            csp="$(printf '%s\n' "$headers" | grep -i '^content-security-policy:' | head -n 1 || true)"
            if [[ -n "$csp" ]] \
              && ! printf '%s' "$csp" | grep -qi 'unsafe-eval' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: credentialless' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^cross-origin-resource-policy: same-origin' \
              && printf '%s\n' "$headers" | grep -qi '^permissions-policy:' \
              && printf '%s\n' "$headers" | grep -qi '^x-frame-options:' \
              && printf '%s\n' "$headers" | grep -qi '^strict-transport-security:' \
              && printf '%s\n' "$headers" | grep -qi '^x-content-type-options:'; then
              echo "Selected preview has the expected security headers and no unsafe-eval."
              echo "$csp"
              exit 0
            fi
            echo "Selected preview not ready or CSP still permits unsafe-eval (attempt $attempt/30)."
            sleep 10
          done
          echo "::error::Selected preview does not expose the expected secure CSP/headers."
          exit 1

      - name: Scan the verified Cloudflare deployment
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: badboy-zap-baseline-report

      - name: Enforce ZAP risk threshold (no Medium or High alerts)
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const reportPath = 'report_json.json';
          if (!fs.existsSync(reportPath)) {
            throw new Error('ZAP JSON report is missing; scan did not produce auditable results.');
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const alerts = (report.site ?? []).flatMap((site) => site.alerts ?? []);
          const blocking = alerts.filter((alert) => /^(High|Medium)\b/.test(alert.riskdesc ?? ''));

          for (const alert of alerts) {
            console.log(`${alert.riskdesc ?? 'Unknown risk'}: ${alert.name}`);
          }

          if (blocking.length) {
            for (const alert of blocking) {
              console.error(`::error::ZAP ${alert.riskdesc}: ${alert.name}`);
            }
            throw new Error(`ZAP found ${blocking.length} Medium/High alert(s). Review report_json.json.`);
          }

          console.log(`ZAP policy passed: no Medium/High alerts; ${alerts.length} Low/Informational finding(s) retained in the report.`);
          NODE
