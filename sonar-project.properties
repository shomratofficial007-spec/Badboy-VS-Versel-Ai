# SonarCloud project identity
sonar.organization=shomratofficial007-spec
sonar.projectKey=shomratofficial007-spec_Badboy-VS-Versel-Ai
sonar.projectName=Badboy VS Versel AI
sonar.sourceEncoding=UTF-8

# Analyze maintained application and Worker source. Generated/build/vendor output is excluded.
sonar.sources=artifacts/mobile,functions,lib,scripts
sonar.tests=artifacts/mobile,functions,lib,scripts
sonar.exclusions=**/node_modules/**,**/.expo/**,**/android/**,**/ios/**,**/build/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.png
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/test/**,**/tests/**

# LCOV is generated by the SonarCloud workflow before analysis.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
