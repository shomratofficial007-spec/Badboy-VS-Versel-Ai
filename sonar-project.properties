# SonarCloud project identity
sonar.organization=shomratofficial007-spec
sonar.projectKey=shomratofficial007-spec_Badboy-VS-Versel-Ai
sonar.projectName=Badboy VS Versel AI
sonar.sourceEncoding=UTF-8

# Analyze maintained application and Worker source. Generated/build/vendor output is excluded.
sonar.sources=artifacts/mobile,functions,lib,scripts
sonar.tests=artifacts/mobile,functions,lib,scripts
sonar.exclusions=**/node_modules/**,**/.expo/**,**/android/**,**/ios/**,**/build/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.png
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/tests/**

# Exclude generated/configuration files and Expo Router screens from Sonar coverage metrics.
# Router screens remain statically analyzed; critical screen coverage is enforced by the workflow's LCOV thresholds.
sonar.coverage.exclusions=artifacts/mobile/scripts/build.js,**/generated/**,**/*.generated.ts,**/*.generated.tsx,**/api.schemas.ts,**/orval.config.ts,**/drizzle.config.ts,artifacts/mobile/app/_layout.tsx,artifacts/mobile/app/(tabs)/_layout.tsx,artifacts/mobile/app/(tabs)/index.tsx,artifacts/mobile/app/**/*.tsx

# LCOV is generated and validated by the SonarCloud workflow before analysis.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage/python-coverage.xml

# Keep generated/configuration files out of duplication metrics as well.
# They remain in source analysis; only coverage and duplication metrics exclude them.
sonar.cpd.exclusions=**/generated/**,**/*.generated.ts,**/*.generated.tsx,**/api.schemas.ts,**/orval.config.ts,**/drizzle.config.ts
